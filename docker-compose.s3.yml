# Optional overlay that swaps local-disk resume storage for S3-compatible
# object storage (MinIO). This demonstrates that the FileStorage interface
# makes the swap a config change, not a rewrite.
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up --build
#
# MinIO console: http://localhost:9001  (minioadmin / minioadmin)
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: resumes
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      minio:
        condition: service_started

  worker:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: resumes
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      minio:
        condition: service_started

volumes:
  minio_data:
